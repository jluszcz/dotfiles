repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-toml
    -   id: check-yaml
    -   id: detect-aws-credentials
        args:
            - --allow-missing-credentials
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
    -   id: ruff-check
        types_or: [file]
        files: 'dot_bin/executable_(plex-sync|rust-reminder)'
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    # .tmpl files are excluded because shellcheck cannot parse chezmoi's
    # {{ ... }} syntax; the local hook below renders them first and covers them.
    -   id: shellcheck
        types: [file]
        files: 'dot_bin/executable_|dot_config/rustbin'
        exclude: '(\.tmpl$|executable_(plex-sync|rust-reminder))'
        args: [-x]
-   repo: local
    hooks:
    -   id: shellcheck-templates
        name: shellcheck chezmoi shell templates
        entry: scripts/shellcheck-templates.sh
        language: script
        files: '^run_.*\.sh\.tmpl$'
